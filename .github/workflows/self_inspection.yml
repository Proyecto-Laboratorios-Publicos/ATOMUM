name: ATOMUM Self-Inspection

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install libcst jinja2 pylint

      - name: Run Self-Inspection
        env:
          PYTHONPATH: .
        run: |
          python -m core.self_inspection.service

      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-inspection-reports
          path: self_inspection_reports/
          if-no-files-found: ignore
