name: Auto-Patch Validation

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AST and Idempotency Validation
        env:
          PYTHONPATH: "."
        run: |
          python -m core.validator
          python -m core.idempotency_simulator

      - name: System Health Check
        run: |
          echo "✨ Pipeline de validación de ATOMUM completado con éxito."
