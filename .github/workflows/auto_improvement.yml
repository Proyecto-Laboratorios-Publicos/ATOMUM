name: Auto-Improvement GitOps

on:
  workflow_dispatch:
    inputs:
      improvement_file:
        description: 'Path to improvement.json'
        required: true
        default: 'improvement.json'

jobs:
  gitops:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      REPO_URL: ${{ github.repositoryUrl }}
      BASE_BRANCH: main
      WORKDIR: /tmp/atomum_repo
      IMPROVEMENT_FILE: ${{ github.event.inputs.improvement_file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar GitOps Engine
        env:
          PYTHONPATH: "."
        run: |
          python core/gitops_engine.py
