name: Auto-Improvement GitOps

on:
  workflow_dispatch:
    inputs:
      improvement_file:
        description: 'Path to improvement.json'
        required: true
        default: 'improvement.json'

jobs:
  gitops:
    runs-on: ubuntu-latest
    
    # 1️⃣ Forzamos que la raíz del workspace sea el directorio de trabajo predeterminado
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REPO_URL: ${{ github.repositoryUrl }}
      BASE_BRANCH: main
      WORKDIR: /tmp/atomum_repo
      IMPROVEMENT_FILE: ${{ github.event.inputs.improvement_file }}

    steps:
      # 2️⃣ Checkout limpio en la raíz (sin path: scripts que altere las rutas)
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install GitPython requests python-dotenv pytest

      # 3️⃣ Ejecución limpia apuntando a core/gitops_engine.py
      - name: Ejecutar GitOps Engine
        run: |
          python core/gitops_engine.py
