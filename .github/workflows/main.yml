- name: Run ATOMUM E2E cycle
        env:
          PYTHONPATH: .
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ATOMUM_DIRECTIVE: ${{ inputs.directive }}
          ATOMUM_TARGET: ${{ inputs.target }}
        run: |
          mkdir -p artifacts
          python - <<'EOF'
          import json
          import os
          from autonomous_loop.agents.graph_orchestrator import run_atomum_cycle

          directive = os.getenv(
              "ATOMUM_DIRECTIVE",
              "Auditar exposición de servicio web, endurecer configuración y generar informe final",
          )
          target = os.getenv("ATOMUM_TARGET") or None

          result = run_atomum_cycle(directive=directive, target=target)

          with open("artifacts/e2e_result.json", "w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  indent=2,
                  default=lambda o: o.model_dump() if hasattr(o, "model_dump") else str(o),
                  ensure_ascii=False,
              )

          markdown_report = ""
          for entry in reversed(result.get("findings", [])):
              if isinstance(entry, dict) and entry.get("agent") == "report_agent":
                  rep = entry.get("report", {})
                  if isinstance(rep, dict):
                      markdown_report = rep.get("markdown_report", "")
                  break

          with open("artifacts/final_report.md", "w", encoding="utf-8") as f:
              f.write(markdown_report or "# Informe ATOMUM\n\nSin reporte Markdown generado.")

          print("Iterations:", result.get("iteration"))
          print("Next agent:", result.get("next_agent"))
          print("Errors:", result.get("errors"))
          EOF
