name: CI – GitOps Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gitops-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar GitOps Engine
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ secrets.REPO_URL || github.repositoryUrl }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PYTHONPATH: "."
        run: |
          python core/gitops_engine.py

      - name: Debug – list workspace
        if: failure()
        run: |
          echo "=== ${{ github.workspace }} ==="
          find . -maxdepth 3 -not -path '*/.*'
