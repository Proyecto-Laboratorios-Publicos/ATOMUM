[tool.poetry]
name = "atomum"
version = "1.0.0"
description = "Framework autónomo de orquestación de agentes con arquitectura modular y motor cognitivo integrado"
authors = ["Lucas <lucas@atomum.ai>"]
readme = "README.md"
packages = [{include = "atomum"}]

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.38.0"
groq = "^0.4.0"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
pydantic = "^2.6.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
hypothesis = "^6.98.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: pruebas de integración del flujo completo",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
